  </head><body class="bg-background text-on-surface font-body-md"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-container-margin flex items-center gap-md"><button class="w-12 h-12 -ml-2 flex items-center justify-center text-on-surface active:bg-surface-container-high rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex-1 flex flex-col overflow-hidden"><span class="font-label-sm text-[10px] text-primary uppercase tracking-widest truncate">NeoGuard Clinical</span><h1 class="font-headline-md text-body-lg text-on-surface truncate tracking-tight">Screen</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="relative w-full pt-16 bg-surface min-h-screen"><div class="flex flex-col w-full h-[calc(100vh-4rem)] relative bg-black overflow-hidden">
<!-- Camera Feed Simulation (Placeholder Image) -->
<div class="absolute inset-0 w-full h-full" data-alt="Close up, high resolution macro photograph of an infant's eye, focusing on the white sclera. Soft, diffused, sterile clinical lighting. The eye is calm and still. The image should look like a live feed from a medical diagnostic camera, slightly cool color temperature." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAe_jGc7jovtDB3vxLS_VwCSSnkG4-QD74gB6BC0FhrtfDWoNuPSsm3b6OM5jUC_q0VjmdoG3_oULCeHEXDUo9eVxjzU4bBX9kcdZ1_p9CMwH-EKjgxcA6Mz1n7n_whxwKGyJxNgTDZ0n5PzQEIvTC2YmSReP7W0Fp5fJLklyZR-ef-mLdJmDJRqvo0147GDfG3khZDjgCUWRATuFtfgG_WDMT2e30nHYz562J4A4iHfMmXMne-ulsi')"></div>
<!-- Medical UI Overlay -->
<div class="absolute inset-0 w-full h-full pointer-events-none flex flex-col justify-between p-lg">
<!-- Top HUD: Status Indicators -->
<div class="flex justify-between items-start pt-sm">
<div class="flex flex-col gap-xs">
<div class="bg-surface-container-highest/80 backdrop-blur-md rounded-full px-sm py-xs flex items-center gap-base">
<span class="material-symbols-outlined text-[16px] text-primary">light_mode</span>
<span class="font-label-sm text-on-surface">Lighting: Optimal</span>
</div>
<div class="bg-surface-container-highest/80 backdrop-blur-md rounded-full px-sm py-xs flex items-center gap-base">
<span class="material-symbols-outlined text-[16px] text-primary">center_focus_strong</span>
<span class="font-label-sm text-on-surface">Focus: Locked</span>
</div>
</div>
<div class="bg-primary/20 backdrop-blur-md border-[1px] border-primary/50 rounded-full px-sm py-xs flex items-center gap-base">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-on-primary-container">Target Detected</span>
</div>
</div>
<!-- Center: Targeting Reticle -->
<div class="flex-1 flex flex-col items-center justify-center relative">
<!-- Distance indicator -->
<div class="absolute top-0 -mt-xl flex flex-col items-center">
<div class="bg-surface-container-highest/90 backdrop-blur-md rounded-lg px-md py-sm flex flex-col items-center gap-xs shadow-lg">
<span class="font-label-md text-on-surface">Distance</span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-md text-primary">18</span>
<span class="font-label-sm text-on-surface-variant">cm</span>
</div>
<span class="font-label-sm text-secondary bg-secondary-container px-2 py-0.5 rounded">Good</span>
</div>
</div>
<!-- Reticle Box -->
<div class="relative w-64 h-48 flex items-center justify-center">
<!-- Corner brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
<!-- Sclera alignment guide (ellipse) -->
<div class="w-48 h-24 border-2 border-primary/40 border-dashed rounded-[50%] animate-[pulse_2s_ease-in-out_infinite]"></div>
</div>
</div>
<!-- Bottom Instruction & Action -->
<div class="flex flex-col gap-md pb-md pointer-events-auto">
<div class="bg-surface/95 backdrop-blur-lg rounded-xl p-md shadow-xl text-center border-[1px] border-outline-variant/30" id="captureHint">
<span class="font-body-md text-on-surface block">Position the baby's eye inside the guide.</span>
<span class="font-label-sm text-on-surface-variant mt-xs block">Ensure the sclera (white part) is clearly visible.</span>
</div>
<p class="font-label-sm text-center bg-error-container text-on-error-container rounded-lg p-sm" id="captureError" style="display:none;"></p>
<button class="h-touch-target w-full bg-primary text-on-primary font-label-md rounded-lg flex items-center justify-center gap-base active:bg-surface-tint transition-colors shadow-md relative overflow-hidden" id="captureBtn">
<span class="material-symbols-outlined text-[24px]" id="captureIcon">camera</span>
<span id="captureLabel">Capture</span>
      </button>
<input accept="image/*" capture="environment" id="captureFileInput" style="display:none;" type="file"/>
</div>
</div>
</div>
<script>
(function () {
  var btn = document.getElementById('captureBtn');
  var input = document.getElementById('captureFileInput');
  var errorEl = document.getElementById('captureError');
  var hintEl = document.getElementById('captureHint');
  var icon = document.getElementById('captureIcon');
  var label = document.getElementById('captureLabel');

  btn.addEventListener('click', function () {
    errorEl.style.display = 'none';
    input.click();
  });

  input.addEventListener('change', function () {
    var file = input.files[0];
    if (!file) return;
    btn.disabled = true;
    icon.textContent = 'hourglass_top';
    label.textContent = 'Analyzing...';
    hintEl.style.display = 'none';
    errorEl.style.display = 'none';

    var body = new FormData();
    body.append('file', file);
    fetch('/api/analyze', { method: 'POST', body: body })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.status === 'OK') {
          sessionStorage.setItem('neoguard_result', JSON.stringify(data));
          window.location.href = 'screening_result.html';
        } else {
          var reasons = (data.reasons || ['analysis failed']).join('; ');
          errorEl.textContent = 'Recapture required: ' + reasons;
          errorEl.style.display = 'block';
          hintEl.style.display = 'block';
        }
      })
      .catch(function (err) {
        errorEl.textContent = 'Could not reach NeoGuard server: ' + err.message;
        errorEl.style.display = 'block';
        hintEl.style.display = 'block';
      })
      .finally(function () {
        btn.disabled = false;
        icon.textContent = 'camera';
        label.textContent = 'Capture';
        input.value = '';
      });
  });
})();
</script>
</main></body></html>
